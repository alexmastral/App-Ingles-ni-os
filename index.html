<!DOCTYPE html>
<html lang="es">
<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }

  background-image:-webkit-linear-gradient(top, #3E6157, #2C463E 55%, #22362F);
  background-image:linear-gradient(to bottom, #3E6157, #2C463E 55%, #22362F);

  -webkit-animation:pop .5s; animation:pop .5s; }

@keyframes pop { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }

<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="fx"></canvas>
    <div id="win"><span>Great!</span></div>
    <div id="start">
      <h1>First Words</h1>

        <svg viewBox="0 0 48 48"><path d="M6 18h9l12-9v30l-12-9H6a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z" fill="currentColor"/><path d="M32 17a11 11 0 0 1 0 14M37 11a19 19 0 0 1 0 26" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/></svg>

    </button>

  </div>
</div>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var cv = $("#cv"), ctx = cv.getContext("2d");
var fx = $("#fx"), fctx = fx.getContext("2d");
var stage = $("#stage");
var W = 0, H = 0;
var CONFETTI = ["#E8503A","#F2953E","#F7C948","#4FA97A","#2FA8A0","#3E7FBF","#8E5FB0","#EF7FA5"];

/* ---- sonido ---- */
var actx = null;
function audioOn(){
  if(!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; } }
  if(actx && actx.state === "suspended" && actx.resume){ actx.resume(); }
}
function tone(freq, start, dur, vol){
  if(!actx) return;
  var t0 = actx.currentTime + start;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sndSnap(){ tone(880, 0, 0.14, 0.16); tone(1320, 0.06, 0.16, 0.11); }
function sndPop(){ tone(660, 0, 0.09, 0.09); }

function sky(c,w,h,a,b){
  var g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,a); g.addColorStop(1,b);
  c.fillStyle = g; c.fillRect(0,0,w,h);
}
function circ(c,x,y,r,col){ c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,6.2832); c.fill(); }
function cloud(c,x,y,s,col){
  c.fillStyle = col || "#FFFFFF";
  c.beginPath();
  c.arc(x,y,s,0,6.2832); c.arc(x+s*0.9,y+s*0.15,s*0.75,0,6.2832);
  c.arc(x-s*0.85,y+s*0.2,s*0.62,0,6.2832); c.arc(x+s*0.1,y+s*0.5,s*0.8,0,6.2832);
  c.fill();
}
function sun(c,x,y,r){
  c.strokeStyle="#F7C948"; c.lineWidth=r*0.16; c.lineCap="round";
  for(var i=0;i<10;i++){
    var a=i*0.6283;
    c.beginPath();
    c.moveTo(x+Math.cos(a)*r*1.32, y+Math.sin(a)*r*1.32);
    c.lineTo(x+Math.cos(a)*r*1.68, y+Math.sin(a)*r*1.68);
    c.stroke();
  }
  circ(c,x,y,r,"#FFD84D");
}
function eyes(c,x,y,r,d){
  circ(c,x-d,y,r,"#2B2B2B"); circ(c,x+d,y,r,"#2B2B2B");
  circ(c,x-d+r*0.3,y-r*0.3,r*0.34,"#FFFFFF"); circ(c,x+d+r*0.3,y-r*0.3,r*0.34,"#FFFFFF");
}

/* ---- helpers gatunos ---- */
function ell(c,x,y,rx,ry,col){
  c.save(); c.translate(x,y); c.scale(1,ry/rx);
  c.fillStyle=col; c.beginPath(); c.arc(0,0,rx,0,6.2832); c.fill(); c.restore();
}
function catFace(c,x,y,r,o){

  c.beginPath(); c.moveTo(x+r*0.82,y-r*0.52); c.lineTo(x+r*0.74,y-r*1.44); c.lineTo(x+r*0.06,y-r*0.90); c.closePath(); c.fill();
  c.fillStyle=inner;
  c.beginPath(); c.moveTo(x-r*0.70,y-r*0.66); c.lineTo(x-r*0.65,y-r*1.18); c.lineTo(x-r*0.24,y-r*0.86); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(x+r*0.70,y-r*0.66); c.lineTo(x+r*0.65,y-r*1.18); c.lineTo(x+r*0.24,y-r*0.86); c.closePath(); c.fill();
  circ(c,x,y,r,fur);
  if(o.stripes){
    c.strokeStyle=o.stripes; c.lineWidth=r*0.10; c.lineCap="round";
    for(var s=-1;s<2;s++){
      c.beginPath();
      c.moveTo(x+s*r*0.26, y-r*0.86); c.lineTo(x+s*r*0.30, y-r*0.52);
      c.stroke();
    }
  }
  var ey=y-r*0.16, ed=r*0.38;
  if(o.closed){
    c.strokeStyle=line; c.lineWidth=r*0.075; c.lineCap="round";
    c.beginPath(); c.moveTo(x-ed-r*0.17,ey); c.quadraticCurveTo(x-ed,ey+r*0.24,x-ed+r*0.17,ey);
    c.moveTo(x+ed-r*0.17,ey); c.quadraticCurveTo(x+ed,ey+r*0.24,x+ed+r*0.17,ey);
    c.stroke();
  } else {
    circ(c,x-ed,ey,r*0.17,eye); circ(c,x+ed,ey,r*0.17,eye);
    circ(c,x-ed+r*0.055,ey-r*0.055,r*0.06,"#FFFFFF");
    circ(c,x+ed+r*0.055,ey-r*0.055,r*0.06,"#FFFFFF");
  }
  c.fillStyle=inner; c.beginPath();
  c.moveTo(x-r*0.12,y+r*0.15); c.lineTo(x+r*0.12,y+r*0.15); c.lineTo(x,y+r*0.32); c.closePath(); c.fill();
  c.strokeStyle=line; c.lineWidth=r*0.055; c.lineCap="round";
  c.beginPath();
  c.moveTo(x,y+r*0.32); c.lineTo(x,y+r*0.44);
  c.moveTo(x,y+r*0.44); c.quadraticCurveTo(x-r*0.15,y+r*0.62,x-r*0.26,y+r*0.44);
  c.moveTo(x,y+r*0.44); c.quadraticCurveTo(x+r*0.15,y+r*0.62,x+r*0.26,y+r*0.44);
  c.stroke();
  if(o.whiskers !== false){
    c.lineWidth=r*0.042;
    for(var i=-1;i<2;i++){
      var yy=y+r*0.20+i*r*0.20;
      c.beginPath(); c.moveTo(x-r*0.60,yy); c.lineTo(x-r*1.34,yy-i*r*0.12); c.stroke();
      c.beginPath(); c.moveTo(x+r*0.60,yy); c.lineTo(x+r*1.34,yy-i*r*0.12); c.stroke();
    }
  }
}
function bodyPath(c,x,y,s){
  c.beginPath();
  c.moveTo(x-s*0.36,y);
  c.bezierCurveTo(x-s*0.42,y-s*0.36, x-s*0.28,y-s*0.66, x,y-s*0.66);
  c.bezierCurveTo(x+s*0.28,y-s*0.66, x+s*0.42,y-s*0.36, x+s*0.36,y);
  c.closePath();
}
function catSit(c,x,y,s,o){
  c.strokeStyle=o.fur; c.lineWidth=s*0.14; c.lineCap="round";
  c.beginPath(); c.moveTo(x+s*0.30,y-s*0.06);
  c.quadraticCurveTo(x+s*0.80,y+s*0.06, x+s*0.70,y-s*0.42); c.stroke();
  bodyPath(c,x,y,s); c.fillStyle=o.fur; c.fill();
  if(o.stripes){
    c.save(); bodyPath(c,x,y,s); c.clip();
    c.strokeStyle=o.stripes; c.lineWidth=s*0.075; c.lineCap="round";
    for(var i=0;i<4;i++){
      var yy=y-s*0.10-i*s*0.14;
      c.beginPath();
      c.moveTo(x-s*0.42,yy); c.quadraticCurveTo(x,yy-s*0.07,x+s*0.42,yy); c.stroke();
    }
    c.restore();
  }
  ell(c,x-s*0.17,y-s*0.04,s*0.13,s*0.075,o.fur);
  ell(c,x+s*0.17,y-s*0.04,s*0.13,s*0.075,o.fur);
  catFace(c,x,y-s*0.86,s*0.32,o);
}


function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}


/* =========================================================
   2c. Inglés: escucha y toca
   ========================================================= */
function icCat(c,s){ catFace(c,s*0.5,s*0.56,s*0.24,{fur:"#F2953E",inner:"#EF7FA5"}); }
function icDog(c,s){
  ell(c,s*0.20,s*0.52,s*0.11,s*0.19,"#8A5A3B");
  ell(c,s*0.80,s*0.52,s*0.11,s*0.19,"#8A5A3B");
  circ(c,s*0.5,s*0.52,s*0.25,"#C08552");
  ell(c,s*0.5,s*0.67,s*0.17,s*0.12,"#E8C9A8");
  circ(c,s*0.5,s*0.615,s*0.055,"#3A3440");
  circ(c,s*0.40,s*0.46,s*0.045,"#3A3440"); circ(c,s*0.60,s*0.46,s*0.045,"#3A3440");
  circ(c,s*0.415,s*0.445,s*0.016,"#FFFFFF"); circ(c,s*0.615,s*0.445,s*0.016,"#FFFFFF");
  c.strokeStyle="#3A3440"; c.lineWidth=s*0.018; c.lineCap="round";
  c.beginPath(); c.moveTo(s*0.5,s*0.665); c.lineTo(s*0.5,s*0.715);
  c.moveTo(s*0.5,s*0.715); c.quadraticCurveTo(s*0.44,s*0.775,s*0.40,s*0.715);
  c.moveTo(s*0.5,s*0.715); c.quadraticCurveTo(s*0.56,s*0.775,s*0.60,s*0.715); c.stroke();
}
function icFish(c,s){
  c.fillStyle="#F2953E"; c.beginPath();
  c.moveTo(s*0.72,s*0.5); c.quadraticCurveTo(s*0.48,s*0.18,s*0.24,s*0.5);
  c.quadraticCurveTo(s*0.48,s*0.82,s*0.72,s*0.5); c.fill();
  c.fillStyle="#E8503A"; c.beginPath();
  c.moveTo(s*0.71,s*0.5); c.lineTo(s*0.90,s*0.30); c.lineTo(s*0.90,s*0.70); c.closePath(); c.fill();
  c.fillStyle="#F7C948"; c.beginPath();
  c.moveTo(s*0.42,s*0.30); c.quadraticCurveTo(s*0.50,s*0.12,s*0.60,s*0.33); c.closePath(); c.fill();
  circ(c,s*0.34,s*0.46,s*0.055,"#FFFFFF"); circ(c,s*0.335,s*0.465,s*0.030,"#2B2B2B");
}
function icBird(c,s){
  ell(c,s*0.48,s*0.60,s*0.21,s*0.17,"#3E7FBF");
  c.fillStyle="#2E6296"; c.beginPath();
  c.moveTo(s*0.30,s*0.55); c.quadraticCurveTo(s*0.44,s*0.66,s*0.56,s*0.72);
  c.quadraticCurveTo(s*0.36,s*0.74,s*0.30,s*0.55); c.fill();
  circ(c,s*0.62,s*0.40,s*0.145,"#3E7FBF");
  c.fillStyle="#F2953E"; c.beginPath();
  c.moveTo(s*0.755,s*0.39); c.lineTo(s*0.90,s*0.44); c.lineTo(s*0.755,s*0.47); c.closePath(); c.fill();
  circ(c,s*0.655,s*0.375,s*0.032,"#2B2B2B"); circ(c,s*0.665,s*0.366,s*0.012,"#FFFFFF");
  c.strokeStyle="#F2953E"; c.lineWidth=s*0.022; c.lineCap="round";
  c.beginPath(); c.moveTo(s*0.44,s*0.76); c.lineTo(s*0.42,s*0.86);
  c.moveTo(s*0.56,s*0.76); c.lineTo(s*0.58,s*0.86); c.stroke();
}
function icDuck(c,s){
  ell(c,s*0.46,s*0.62,s*0.24,s*0.17,"#F7C948");
  circ(c,s*0.66,s*0.38,s*0.145,"#F7C948");
  c.fillStyle="#F2953E"; c.beginPath();
  c.moveTo(s*0.79,s*0.36); c.quadraticCurveTo(s*0.94,s*0.40,s*0.79,s*0.46); c.fill();
  circ(c,s*0.685,s*0.355,s*0.030,"#2B2B2B"); circ(c,s*0.695,s*0.346,s*0.011,"#FFFFFF");
  c.strokeStyle="#E0B234"; c.lineWidth=s*0.020; c.lineCap="round";
  c.beginPath(); c.arc(s*0.42,s*0.62,s*0.11,0.4,2.6); c.stroke();
  c.strokeStyle="#9BD7F0"; c.lineWidth=s*0.030;
  c.beginPath(); c.moveTo(s*0.12,s*0.80); c.lineTo(s*0.88,s*0.80); c.stroke();
}
function icBee(c,s){
  ell(c,s*0.34,s*0.34,s*0.15,s*0.10,"rgba(255,255,255,0.85)");
  ell(c,s*0.62,s*0.30,s*0.15,s*0.10,"rgba(255,255,255,0.85)");
  ell(c,s*0.50,s*0.60,s*0.24,s*0.18,"#F7C948");
  c.save();
  c.beginPath(); c.save(); c.translate(s*0.50,s*0.60); c.scale(1,0.75);
  c.arc(0,0,s*0.24,0,6.2832); c.restore(); c.clip();
  c.fillStyle="#3A3440";
  c.fillRect(s*0.42,s*0.40,s*0.07,s*0.42); c.fillRect(s*0.56,s*0.40,s*0.07,s*0.42);
  c.restore();
  circ(c,s*0.32,s*0.56,s*0.030,"#2B2B2B");
  c.strokeStyle="#3A3440"; c.lineWidth=s*0.016; c.lineCap="round";
  c.beginPath(); c.moveTo(s*0.30,s*0.46); c.lineTo(s*0.24,s*0.34);
  c.moveTo(s*0.38,s*0.44); c.lineTo(s*0.36,s*0.30); c.stroke();
}
function icFrog(c,s){
  circ(c,s*0.34,s*0.36,s*0.115,"#4FA97A");
  circ(c,s*0.66,s*0.36,s*0.115,"#4FA97A");
  circ(c,s*0.34,s*0.34,s*0.062,"#FFFFFF"); circ(c,s*0.66,s*0.34,s*0.062,"#FFFFFF");
  circ(c,s*0.34,s*0.35,s*0.032,"#2B2B2B"); circ(c,s*0.66,s*0.35,s*0.032,"#2B2B2B");
  ell(c,s*0.50,s*0.60,s*0.28,s*0.20,"#4FA97A");
  c.strokeStyle="#2E7A52"; c.lineWidth=s*0.026; c.lineCap="round";
  c.beginPath(); c.arc(s*0.50,s*0.56,s*0.16,0.55,2.59); c.stroke();
  ell(c,s*0.22,s*0.76,s*0.09,s*0.05,"#4FA97A");
  ell(c,s*0.78,s*0.76,s*0.09,s*0.05,"#4FA97A");
}
function icButterfly(c,s){
  c.fillStyle="#8E5FB0";
  c.beginPath(); c.moveTo(s*0.5,s*0.46); c.quadraticCurveTo(s*0.10,s*0.16,s*0.14,s*0.48);
  c.quadraticCurveTo(s*0.18,s*0.72,s*0.5,s*0.52); c.fill();

  c.beginPath(); c.moveTo(s*0.5,s*0.44); c.lineTo(s*0.52,s*0.26); c.stroke();
  c.fillStyle="#4FA97A"; c.beginPath();
  c.moveTo(s*0.53,s*0.30); c.quadraticCurveTo(s*0.78,s*0.16,s*0.66,s*0.36);

  rr(c,s*0.12,s*0.50,s*0.76,s*0.22,s*0.07); c.fill();
  c.beginPath();
  c.moveTo(s*0.28,s*0.50); c.lineTo(s*0.38,s*0.30); c.lineTo(s*0.66,s*0.30);
  c.lineTo(s*0.74,s*0.50); c.closePath(); c.fill();
  c.fillStyle="#9BD7F0";
  c.beginPath(); c.moveTo(s*0.35,s*0.47); c.lineTo(s*0.42,s*0.34); c.lineTo(s*0.49,s*0.34);
  c.lineTo(s*0.49,s*0.47); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(s*0.53,s*0.34); c.lineTo(s*0.63,s*0.34); c.lineTo(s*0.69,s*0.47);
  c.lineTo(s*0.53,s*0.47); c.closePath(); c.fill();
  circ(c,s*0.31,s*0.74,s*0.10,"#3A3440"); circ(c,s*0.69,s*0.74,s*0.10,"#3A3440");
  circ(c,s*0.31,s*0.74,s*0.042,"#C9C9C9"); circ(c,s*0.69,s*0.74,s*0.042,"#C9C9C9");
}
function icBlob(col){
  return function(c,s){
    circ(c,s*0.5,s*0.5,s*0.30,col);
    c.fillStyle="rgba(255,255,255,0.30)";
    c.beginPath(); c.arc(s*0.42,s*0.40,s*0.10,0,6.2832); c.fill();
  };
}
function icNum(n){
  return function(c,s){
    c.fillStyle="#3B2E28";
    c.font = "bold " + Math.round(s*0.40) + "px \"Avenir Next\", sans-serif";
    c.textAlign="center"; c.textBaseline="middle";
    c.fillText(String(n), s*0.5, s*0.36);
    var cols = Math.min(n,3), r0 = s*0.055;
    for(var i=0;i<n;i++){
      var col = i % cols, row = Math.floor(i/cols);
      var total = Math.min(n - row*cols, cols);
      var x0 = s*0.5 - (total-1)*s*0.085/1 + col*s*0.17;
      circ(c, x0, s*0.66 + row*s*0.15, r0, "#E8503A");
    }
  };
}

/* ---- voz ---- */
var voiceEN = null;
function pickVoice(){
  try {
    var vs = window.speechSynthesis.getVoices(), i;
    for(i=0;i<vs.length;i++){ if(vs[i].lang && vs[i].lang.replace("_","-").indexOf("en-US") === 0) return vs[i]; }
    for(i=0;i<vs.length;i++){ if(vs[i].lang && vs[i].lang.indexOf("en") === 0) return vs[i]; }
  } catch(e){}
  return null;
}
if(window.speechSynthesis){
  voiceEN = pickVoice();
  try { window.speechSynthesis.onvoiceschanged = function(){ voiceEN = pickVoice(); }; } catch(e){}
}
function say(text, rate){
  if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return false;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate || 0.72;
    u.pitch = 1.05;
    if(!voiceEN) voiceEN = pickVoice();
    if(voiceEN) u.voice = voiceEN;
    window.speechSynthesis.speak(u);
    return true;
  } catch(e){ return false; }
}

/* ---- juego ---- */
var ENG_CATS = ["animals","things","colors","numbers"];
var eng = { cat:"animals", target:null, cards:[], score:0, lock:false,
            size:0, gap:0, gy:0, wrong:null, faceCv:{} };
var ENG_GOAL = 6;

function engCard(item, s){
  var key = item.w + "@" + Math.round(s);
  if(eng.faceCv[key]) return eng.faceCv[key];
  var cn = document.createElement("canvas");
  cn.width = Math.round(s*DPR); cn.height = Math.round(s*DPR);
  var c = cn.getContext("2d");
  c.setTransform(DPR,0,0,DPR,0,0);
  c.fillStyle = item.bg; rr(c,0,0,s,s,s*0.13); c.fill();
  item.d(c, s);
  c.strokeStyle = "rgba(0,0,0,0.16)"; c.lineWidth = 2; rr(c,1,1,s-2,s-2,s*0.13); c.stroke();
  eng.faceCv[key] = cn;
  return cn;
}

function engLayout(){
  eng.gap = Math.max(14, Math.min(W,H)*0.038);
  eng.size = Math.max(60, Math.min((W - eng.gap*4)/3, H*0.56));
  eng.gy = H*0.30;
  if(eng.gy + eng.size > H - 12) eng.gy = Math.max(H*0.20, H - 12 - eng.size);
  var total = eng.size*3 + eng.gap*2, i;
  for(i=0;i<eng.cards.length;i++){
    eng.cards[i].x = (W - total)/2 + i*(eng.size + eng.gap);
    eng.cards[i].y = eng.gy;
  }
}

function engRound(){
  var pool = WORDS[eng.cat].slice();
  for(var i=pool.length-1;i>0;i--){
    var k = Math.floor(Math.random()*(i+1)), t = pool[i]; pool[i]=pool[k]; pool[k]=t;
  }
  var pick = pool.slice(0,3);
  eng.target = pick[Math.floor(Math.random()*pick.length)];
  eng.cards = [];
  for(i=0;i<pick.length;i++){ eng.cards.push({ item:pick[i], x:0, y:0 }); }
  eng.lock = false; eng.wrong = null;
  engLayout();
  engDraw();
  setTimeout(function(){ say(eng.target.w); }, 300);
}

function engDraw(){
  var s = eng.size, i;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = "#4A3B32"; ctx.fillRect(0,0,W,H);

  // palabra
  ctx.fillStyle = "#FFFDF7";
  ctx.font = Math.round(Math.min(H*0.115, 64)) + 'px "Marker Felt","Chalkboard SE",cursive';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(eng.target ? eng.target.w : "", W/2, H*0.115);

  // estrellas de progreso
  var st = Math.min(H*0.030, 18), sx = W/2 - (ENG_GOAL-1)*st*2.1/2;
  for(i=0;i<ENG_GOAL;i++){
    ctx.fillStyle = (i < eng.score) ? "#F7C948" : "rgba(255,255,255,0.20)";
    ctx.beginPath();
    for(var k=0;k<10;k++){
      var a = -1.5708 + k*0.6283, r = (k%2===0) ? st : st*0.45;
      var px = sx + i*st*2.1 + Math.cos(a)*r, py = H*0.215 + Math.sin(a)*r;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }

  for(i=0;i<eng.cards.length;i++){
    var cd = eng.cards[i];
    ctx.fillStyle = "rgba(0,0,0,0.20)"; rr(ctx, cd.x, cd.y+4, s, s, s*0.13); ctx.fill();
    ctx.save();
    if(eng.wrong === cd) ctx.globalAlpha = 0.42;
    ctx.drawImage(engCard(cd.item, s), cd.x, cd.y, s, s);
    ctx.restore();
  }
}

function engTap(x,y){
  if(eng.lock) return;
  var s = eng.size, i;
  for(i=0;i<eng.cards.length;i++){
    var cd = eng.cards[i];
    if(x >= cd.x && x <= cd.x+s && y >= cd.y && y <= cd.y+s){
      if(cd.item === eng.target){
        eng.lock = true; eng.score++;
        sndSnap(); engDraw();
        say(eng.target.w, 0.62);
        if(eng.score >= ENG_GOAL){
          setTimeout(function(){ eng.score = 0; celebrate("Great!"); }, 900);
        } else {
          setTimeout(engRound, 1400);
        }
      } else {
        eng.lock = true; eng.wrong = cd; engDraw();
        tone(300, 0, 0.16, 0.10);
        setTimeout(function(){
          eng.wrong = null; eng.lock = false; engDraw();
          say(eng.target.w);
        }, 700);
      }
      return;
    }
  }
}

/* ---- confeti ---- */
var confRAF = null;
function celebrate(texto){
  $("#win span").innerHTML = texto || "Great!";
  $("#win").className = "show";
  fx.className = "show";
  var conf = [], i;
  for(i=0;i<110;i++){
    conf.push({ x: Math.random()*W, y: -Math.random()*H*0.6,
      vx: (Math.random()-0.5)*2.4, vy: 2 + Math.random()*3.6,
      s: 7 + Math.random()*9, a: Math.random()*6.28, va: (Math.random()-0.5)*0.22,
      col: CONFETTI[Math.floor(Math.random()*CONFETTI.length)] });
  }
  var n = [523,659,784,1047,1319];
  for(i=0;i<n.length;i++){ tone(n[i], i*0.11, 0.42, 0.15); }
  var t0 = Date.now();
  function step(){
    fctx.setTransform(DPR,0,0,DPR,0,0);
    fctx.clearRect(0,0,W,H);
    for(var k=0;k<conf.length;k++){
      var p = conf[k];
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += 0.035;
      fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.a);
      fctx.fillStyle = p.col; fctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
      fctx.restore();
    }
    if(Date.now() - t0 < 3600){ confRAF = requestAnimationFrame(step); }
    else {
      fctx.clearRect(0,0,W,H);
      fx.className = ""; $("#win").className = ""; confRAF = null;
      engRound();
    }
  }
  step();
}

/* ---- entradas ---- */
function pos(e){
  var t = e.touches && e.touches.length ? e.touches[0] : e;
  var r = cv.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function onDown(e){
  e.preventDefault(); audioOn();
  var q = pos(e);
  engTap(q.x, q.y);
}
cv.addEventListener("touchstart", onDown, false);
cv.addEventListener("touchmove", function(e){ e.preventDefault(); }, false);
cv.addEventListener("mousedown", onDown, false);
document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, false);
document.addEventListener("touchmove", function(e){ if(e.touches.length > 1) e.preventDefault(); }, false);

/* ---- interfaz ---- */
$("#go").addEventListener("click", function(){
  audioOn(); sndPop();
  $("#start").className = "hide";
  eng.score = 0; engRound();
});
$("#speak").addEventListener("click", function(){
  audioOn(); sndPop();
  if(eng.target) say(eng.target.w);
});
$$(".chip").forEach(function(b){
  b.addEventListener("click", function(){
    audioOn(); sndPop();
    $$(".chip").forEach(function(x){ x.className = "chip"; });
    b.className = "chip on";
    eng.cat = b.getAttribute("data-cat");
    eng.score = 0;
    if($("#start").className !== "hide"){ $("#start").className = "hide"; }
    engRound();
  });
});

/* ---- tamaño ---- */
function resize(){
  W = stage.clientWidth; H = stage.clientHeight;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  fx.style.width = W + "px"; fx.style.height = H + "px";
  fx.width = Math.round(W*DPR); fx.height = Math.round(H*DPR);
  eng.faceCv = {};
  if(eng.target){ engLayout(); engDraw(); }
}
window.addEventListener("resize", function(){ setTimeout(resize, 120); });
window.addEventListener("orientationchange", function(){ setTimeout(resize, 320); });

resize();

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
})();
